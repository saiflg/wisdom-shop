# Reverse proxy for the production stack.
#
# Everything is served from one origin on purpose. The refresh token is an
# httpOnly cookie with SameSite=Strict scoped to Path=/v1/auth; splitting the
# app and API across two hostnames would stop the browser sending it, and the
# usual fix (SameSite=None) is exactly the protection that cookie is for.

upstream wisdom_web {
    server web:3000;
}

upstream wisdom_api {
    server api:4000;
}

# Rate limiting at the edge, in front of the application's own limiter. This
# one sheds load before a request costs a Node process anything; the
# application's is what enforces per-account policy.
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

server {
    listen 80;
    server_name _;

    # ACME challenges must stay on plain HTTP for certificate renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # The app sets its own security headers via helmet. HSTS belongs here
    # because it is a property of the TLS termination point, and helmet only
    # sees requests that already arrived.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Large enough for product imagery, small enough that an unauthenticated
    # POST cannot buffer arbitrary gigabytes.
    client_max_body_size 10m;

    # Do not advertise the nginx version on error pages.
    server_tokens off;

    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://wisdom_web;
        include /etc/nginx/proxy_params_wisdom;
    }

    # Sign-in and registration, throttled harder at the edge as well.
    location ~ ^/v1/auth/(login|register|password-reset) {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://wisdom_api;
        include /etc/nginx/proxy_params_wisdom;
    }

    # Webhooks are proxied straight to the API rather than through Next's
    # rewrite: the signature is computed over the exact bytes the provider
    # sent, so nothing in the path may re-encode the body.
    location /v1/payments/webhooks/ {
        proxy_pass http://wisdom_api;
        proxy_request_buffering off;
        include /etc/nginx/proxy_params_wisdom;
    }

    location /v1/ {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://wisdom_api;
        include /etc/nginx/proxy_params_wisdom;
    }

    location = /health {
        proxy_pass http://wisdom_api/health;
        access_log off;
        include /etc/nginx/proxy_params_wisdom;
    }
}
