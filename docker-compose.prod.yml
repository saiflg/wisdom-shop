# Production topology. Deliberately different from docker-compose.yml in
# three ways that matter:
#
#   1. Nothing but the proxy publishes a port. Postgres, Redis, Meilisearch
#      and both app containers are reachable only on the internal network.
#   2. Images are built from the production Dockerfiles, which compile once
#      and run as a non-root user, rather than the dev ones that watch a
#      bind mount.
#   3. There are no bind mounts of source code. What is in the image is what
#      runs.
#
# Secrets come from a .env file that is NOT the dev one — see
# docs/DEPLOYMENT.md for the list of values that must be changed before this
# is exposed to the internet.

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-wisdom_shop}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    # A password is set even though Redis is not published: an attacker who
    # reaches the internal network should not also get the session store.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      # Disables the bundled web dashboard and enforces the key.
      MEILI_ENV: production
    volumes:
      - meili-data:/meili_data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wisdom_shop}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MEILI_HOST: http://meilisearch:7700
      STORAGE_ROOT: /var/lib/wisdom-shop/storage
    volumes:
      # Uploaded images and downloadable product files. Without this a rebuild
      # would silently take every customer's purchased download with it.
      - storage-data:/var/lib/wisdom-shop/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Migrations run as their own one-shot container rather than in the api
  # entrypoint. With more than one api replica, an entrypoint migration means
  # every replica races to migrate the same database on every deploy.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-wisdom_shop}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    # `migrate deploy` applies committed migrations and never generates or
    # resets — `migrate dev` would happily drop the production database when
    # it found drift.
    command: ["npx", "prisma", "migrate", "deploy"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Derived from SHOP_DOMAIN rather than read from APP_URL so the
        # certificate Caddy requests and the URL baked into the bundle cannot
        # disagree — two sources of truth for the same hostname is how you get
        # a site that loads over one name and calls an API on another.
        NEXT_PUBLIC_APP_URL: https://${SHOP_DOMAIN:?SHOP_DOMAIN is required}
        # A BUILD arg, not a runtime variable, even though it never reaches the
        # browser. Next resolves rewrites() into routes-manifest.json at build
        # time; set at runtime it is ignored and the localhost fallback is
        # baked in, which fails only once a browser calls the API.
        API_URL: http://api:4000
    restart: always
    environment:
      NODE_ENV: production
      # Also at RUNTIME, not only as a build arg.
      #
      # The build arg bakes the rewrite destinations into the routes
      # manifest, which is what makes the browser's calls work. It does
      # nothing for server components: `ENV` does not cross a Docker stage
      # boundary, so the runtime image had no API_URL at all and every
      # server-side fetch fell back to localhost inside its own container.
      #
      # The storefront failed loudly with a 500. The other two fail
      # silently - a branding lookup that cannot reach the API returns
      # "no school" and the console renders unbranded, with a 200.
      API_URL: http://api:4000
    depends_on:
      - api

  # ---- Wisdom Campus (the school ERP) ----
  #
  # Shares the Postgres server with the shop but not its database. The control
  # database holds the school registry; each school gets its own
  # wisdom_ems_school_<slug> database created at onboarding time. That is why
  # ems-api needs POSTGRES_ADMIN_URL: it runs CREATE DATABASE, which ordinary
  # application credentials cannot.
  ems-api:
    build:
      context: .
      dockerfile: apps/ems-api/Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4001
      APP_URL: https://${CAMPUS_DOMAIN:?CAMPUS_DOMAIN is required}
      CONTROL_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${EMS_CONTROL_DB:-wisdom_ems_control}?schema=public
      POSTGRES_ADMIN_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/postgres
      TENANT_DB_HOST: postgres
      TENANT_DB_PORT: 5432
      TENANT_DB_USER: ${POSTGRES_USER}
      TENANT_DB_PASSWORD: ${POSTGRES_PASSWORD}
      EMS_STORAGE_ROOT: /var/lib/wisdom-campus/storage
      # One proxy (Caddy) sits in front, so exactly one X-Forwarded-For hop is
      # trustworthy. Leaving this at 0 would make the rate limiter see every
      # request as coming from Caddy's own address and throttle the whole
      # school as if it were one person.
      TRUST_PROXY_HOPS: 1
      SWAGGER_ENABLED: "false"
    volumes:
      # Photographs of children and staff, school logos, generated PDFs.
      # Without this a rebuild silently discards every photograph.
      - ems-storage:/var/lib/wisdom-campus/storage
    depends_on:
      postgres:
        condition: service_healthy
      ems-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Control-database migrations plus the first platform operator. A one-shot
  # container for the same reason as the shop's `migrate`: with more than one
  # api replica, migrating from the entrypoint means every replica races to
  # migrate the same database on every deploy.
  #
  # Tenant migrations are NOT run here. Each school's database is migrated when
  # that school is onboarded, and again by `deploy.sh --migrate-tenants` after
  # a release that changes the tenant schema — there is no single connection
  # string that reaches them all.
  ems-migrate:
    build:
      context: .
      dockerfile: apps/ems-api/Dockerfile
    restart: "no"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      CONTROL_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${EMS_CONTROL_DB:-wisdom_ems_control}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    # `migrate deploy` applies committed migrations and never generates or
    # resets — `migrate dev` would happily drop the production database when it
    # found drift. The seed is idempotent and skips itself unless
    # SEED_PLATFORM_ADMIN_* are set.
    command: ["sh", "-c", "pnpm prisma:deploy:control && pnpm prisma:seed:control"]

  ems:
    build:
      context: .
      dockerfile: apps/ems/Dockerfile
      args:
        NEXT_PUBLIC_SHOP_URL: https://${SHOP_DOMAIN:?SHOP_DOMAIN is required}
        # See the API_URL note on the web service: this is a BUILD arg because
        # Next bakes rewrite destinations into the routes manifest.
        EMS_API_URL: http://ems-api:4001
    restart: always
    environment:
      NODE_ENV: production
      # Also at RUNTIME, not only as a build arg.
      #
      # The build arg bakes the rewrite destinations into the routes
      # manifest, which is what makes the browser's calls work. It does
      # nothing for server components: `ENV` does not cross a Docker stage
      # boundary, so the runtime image had no EMS_API_URL at all and every
      # server-side fetch fell back to localhost inside its own container.
      #
      # The storefront failed loudly with a 500. The other two fail
      # silently - a branding lookup that cannot reach the API returns
      # "no school" and the console renders unbranded, with a 200.
      EMS_API_URL: http://ems-api:4001
    depends_on:
      - ems-api

  platform:
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
      args:
        EMS_API_URL: http://ems-api:4001
    restart: always
    environment:
      NODE_ENV: production
      # Also at RUNTIME, not only as a build arg.
      #
      # The build arg bakes the rewrite destinations into the routes
      # manifest, which is what makes the browser's calls work. It does
      # nothing for server components: `ENV` does not cross a Docker stage
      # boundary, so the runtime image had no EMS_API_URL at all and every
      # server-side fetch fell back to localhost inside its own container.
      #
      # The storefront failed loudly with a 500. The other two fail
      # silently - a branding lookup that cannot reach the API returns
      # "no school" and the console renders unbranded, with a 200.
      EMS_API_URL: http://ems-api:4001
    depends_on:
      - ems-api

  # Caddy rather than nginx + certbot: it obtains and renews certificates
  # itself. The certs volume is the only state that matters — losing it means
  # re-issuing, which Let's Encrypt rate-limits, so back it up (backup.sh
  # does).
  proxy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN:?SHOP_DOMAIN is required}
      CAMPUS_DOMAIN: ${CAMPUS_DOMAIN:?CAMPUS_DOMAIN is required}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ADMIN_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      # Optional. Set it to a school slug and the campus hostname's root
      # sends people straight to that school's sign-in page instead of the
      # product landing page - which is what you want on a server that
      # exists to show one school. Unset, nothing changes.
      CAMPUS_LANDING_SLUG: ${CAMPUS_LANDING_SLUG:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
      - ems
      - platform

volumes:
  postgres-data:
  storage-data:
  redis-data:
  meili-data:
  ems-storage:
  caddy-data:
  caddy-config:
