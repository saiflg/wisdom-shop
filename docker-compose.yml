name: wisdom-shop

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wisdom
      POSTGRES_PASSWORD: wisdom
      POSTGRES_DB: wisdom_shop
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
      # Only runs against a brand-new (empty) data directory — on this
      # project's existing dev volume it's a no-op; wisdom_ems_control was
      # created manually once instead. Kept for fresh installs and CI.
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wisdom -d wisdom_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./.docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    environment:
      # The key IS enforced — an unauthenticated request to /indexes returns
      # 401. What makes this a dev-only setup is that the key is a published
      # placeholder and the port is bound to the host. In production: set a
      # real MEILI_MASTER_KEY, use MEILI_ENV=production (which also disables
      # the bundled dashboard), and drop the port mapping so only the api
      # service can reach it over the compose network.
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-changeme_dev_master_key}
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - ./.docker-data/meilisearch:/meili_data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://wisdom:wisdom@postgres:5432/wisdom_shop?schema=public
      REDIS_URL: redis://redis:6379
      # Service name, not localhost: .env holds the host-side address for
      # tools run from the host, but inside the network this is the reachable
      # one.
      MEILI_HOST: http://meilisearch:7700
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/workspace/apps/api
      - /workspace/apps/api/node_modules

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    restart: unless-stopped
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_EMS_URL: ${EMS_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/workspace/apps/web
      - /workspace/apps/web/node_modules

  ems:
    build:
      context: .
      dockerfile: apps/ems/Dockerfile.dev
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_SHOP_URL: ${APP_URL:-http://localhost:3000}
      EMS_API_URL: http://ems-api:4001
    ports:
      - "3001:3001"
    depends_on:
      - ems-api
    volumes:
      - ./apps/ems:/workspace/apps/ems
      - /workspace/apps/ems/node_modules

  # Super Admin console. A separate app on its own origin, not a route group
  # inside `ems`, so a school user's browser never receives platform-console
  # code and a platform token is unreachable from the school portal's origin.
  platform:
    build:
      context: .
      dockerfile: apps/platform/Dockerfile.dev
    restart: unless-stopped
    environment:
      EMS_API_URL: http://ems-api:4001
    ports:
      - "3002:3002"
    depends_on:
      - ems-api
    volumes:
      - ./apps/platform:/workspace/apps/platform
      - /workspace/apps/platform/node_modules

  ems-api:
    build:
      context: .
      dockerfile: apps/ems-api/Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override, not inherit from the shared .env: that file's APP_URL is
      # the shop's own origin (localhost:3000). ems-api's CORS must trust
      # apps/ems's origin instead.
      APP_URL: http://localhost:3001
      # The tenant Prisma schema reads DATABASE_URL directly when its
      # migrations are run by hand (ordinary app code never touches it —
      # see tenancy/connection-string.ts). The shared .env's DATABASE_URL is
      # the SHOP'S OWN database; without this override it would be silently
      # inherited here too, and a `prisma migrate dev --schema=prisma/
      # tenant/schema.prisma` run without an explicit -e DATABASE_URL=...
      # override would target wisdom_shop instead of failing loudly. This
      # bogus value makes that mistake fail fast (DNS error) instead.
      DATABASE_URL: postgresql://unset:unset@unset-host:5432/tenant_schema_requires_explicit_database_url
      CONTROL_DATABASE_URL: postgresql://wisdom:wisdom@postgres:5432/wisdom_ems_control?schema=public
      POSTGRES_ADMIN_URL: postgresql://wisdom:wisdom@postgres:5432/postgres
      TENANT_DB_HOST: postgres
      TENANT_DB_PORT: "5432"
      TENANT_DB_USER: wisdom
      TENANT_DB_PASSWORD: wisdom
      PORT: 4001
      # Schools live at <slug>.localhost in dev. Browsers resolve every
      # *.localhost name to loopback with no hosts-file edit, so
      # http://demo-academy.localhost:3001 just works.
      EMS_BASE_DOMAIN: localhost
      # apps/ems forwards the browser's hostname as X-Forwarded-Host on its
      # server-side branding lookup — Next's rewrite proxy replaces the real
      # Host with `ems-api:4001`, so without this every school would resolve
      # to none. Express only reads X-Forwarded-Host when it trusts a proxy.
      #
      # The cost: port 4001 is published in dev, so a direct caller can also
      # spoof X-Forwarded-For and dodge the rate limiter. That is a dev-only
      # exposure and the production topology (nginx in front, API not
      # published) is the one this setting actually describes — see
      # docs/DEPLOYMENT.md.
      TRUST_PROXY_HOPS: "1"
      EMS_STORAGE_ROOT: /workspace/apps/ems-api/.storage
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/ems-api:/workspace/apps/ems-api
      - /workspace/apps/ems-api/node_modules

  # A mail server for development that accepts everything and delivers
  # nothing — every message is caught and shown at http://localhost:8025
  # instead of reaching a real person.
  #
  # This exists because the alternative was worse in both directions. Pointed
  # at a real provider, dev and demo runs send genuine email to whatever
  # address happens to be in the seed data, and a wrong password silently
  # loses every message (which is what happened: 48 failures, 0 delivered).
  # Pointed here, there are no credentials to be wrong, nothing escapes the
  # machine, and the receipt a parent would receive can be read and shown.
  #
  # Dev only: it is absent from docker-compose.prod.yml on purpose, so
  # production cannot accidentally swallow real mail.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "8025:8025"  # the inbox, in a browser
      - "1025:1025"  # SMTP, for ems-api
